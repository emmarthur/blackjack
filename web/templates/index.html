<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blackjack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-blob bg-blob-a" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-b" aria-hidden="true"></div>

    <main class="page">
      <nav class="page-nav" aria-label="Page">
        <a class="nav-link" href="/help">Help</a>
      </nav>

      <header class="hero">
        <div class="hero-badge" aria-hidden="true">♠</div>
        <h1>Blackjack</h1>
        <p class="tagline">Get to 21 — beat the dealer without busting</p>
      </header>

      <section class="card hud" aria-live="polite">
        <p class="money-line">Bankroll: <strong id="money">$5000</strong></p>
        <p id="bet-line" class="bet-line" hidden>Current bet: <strong id="bet">$0</strong></p>
        <p id="status-text" class="status-text"></p>
        <p id="error-text" class="error" role="alert" hidden></p>
      </section>

      <section class="card table" id="table-section" hidden>
        <div class="hand-block">
          <h2 class="hand-label">Dealer <span id="dealer-total" class="hand-total"></span></h2>
          <div id="dealer-cards" class="card-row" aria-label="Dealer cards"></div>
        </div>
        <div class="hand-block">
          <h2 class="hand-label">You <span id="player-total" class="hand-total"></span></h2>
          <div id="player-cards" class="card-row" aria-label="Your cards"></div>
        </div>
      </section>

      <section class="card controls" id="bet-panel">
        <label class="field-label" for="bet-input">Bet amount</label>
        <div class="bet-row">
          <input type="number" id="bet-input" min="1" step="1" value="100" />
          <button type="button" id="btn-deal" class="btn btn-primary">Deal</button>
        </div>
      </section>

      <section class="card controls" id="play-panel" hidden>
        <div class="action-row">
          <button type="button" id="btn-hit" class="btn btn-primary">Hit</button>
          <button type="button" id="btn-stand" class="btn btn-secondary">Stand</button>
          <button type="button" id="btn-double" class="btn btn-secondary" hidden>Double</button>
        </div>
        <div id="double-panel" class="double-panel" hidden>
          <label class="field-label" for="double-input">Additional bet for double down</label>
          <div class="bet-row">
            <input type="number" id="double-input" min="1" step="1" />
            <button type="button" id="btn-confirm-double" class="btn btn-primary">Confirm double</button>
          </div>
        </div>
      </section>

      <section class="card controls" id="after-panel" hidden>
        <button type="button" id="btn-next" class="btn btn-primary">Next hand</button>
        <button type="button" id="btn-reset-bankroll" class="btn btn-secondary">Reset bankroll</button>
      </section>
    </main>

    <script src="/static/session-persist.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
